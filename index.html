<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11131d">
<title>StudyOS MAX — Learn anything</title>
<style>
:root{--bg:#0d0f18;--panel:#151925;--panel2:#1b2030;--line:#2b3245;--muted:#9aa4ba;--text:#f4f6fc;--purple:#9b8cff;--cyan:#63d9d0;--pink:#f28bc1;--green:#72d6a0;--yellow:#f2c879;--radius:19px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#252044 0,transparent 38%),radial-gradient(ellipse at 100% 0%,#16313b 0,transparent 28%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1280px;margin:auto;padding:20px 22px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.6px;font-size:20px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--purple),#5bd7cb);display:grid;place-items:center;color:#101321;font-weight:950;font-size:19px;box-shadow:0 7px 25px #8f7cff40}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:800}.topright{display:flex;align-items:center;gap:10px}.streak{border:1px solid var(--line);background:#171b29;border-radius:999px;padding:8px 13px;color:var(--yellow);font-weight:750;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#292e42;display:grid;place-items:center;font-weight:800;color:var(--cyan)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:20px 0 24px}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:850}.hero h1{font-size:clamp(28px,5vw,43px);line-height:1.08;letter-spacing:-1.7px;margin:7px 0}.hero p{color:var(--muted);margin:8px 0 0}.primary,.secondary,.ghost,.danger{border:0;border-radius:12px;padding:11px 16px;font-weight:800;transition:.18s}.primary{background:linear-gradient(120deg,var(--purple),#7ccece);color:#101321;box-shadow:0 8px 25px #8e80ff28}.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}.secondary{background:#262b3c;border:1px solid #343b51}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}.danger{background:#492631;color:#ffb5c3}.small{padding:8px 11px;font-size:13px}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px;background:#121622;border:1px solid var(--line);border-radius:15px;margin-bottom:22px}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:10px;font-weight:750}.tab.active{background:#2a2e43;color:white;box-shadow:inset 0 0 0 1px #414761}
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.panel{background:linear-gradient(145deg,#191e2c,#141925);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.panel h2,.panel h3{margin:0 0 5px;letter-spacing:-.4px}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#202638;border-radius:14px;padding:13px}.stat strong{display:block;font-size:25px;letter-spacing:-1px}.stat span{font-size:11px;color:var(--muted);font-weight:700}.progress{height:7px;background:#30364a;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:99px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 12px}.sectionhead h2{font-size:19px;margin:0}.setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.setcard{background:#171c29;border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;transition:.18s;min-width:0}.setcard:hover{border-color:#7770bd;transform:translateY(-2px)}.seticon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#2d2949;color:#c1b7ff;font-size:18px;margin-bottom:13px}.setcard h3{margin:0 0 4px;font-size:15px;overflow-wrap:anywhere}.setcard p{margin:0;color:var(--muted);font-size:12px}.setmeta{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:var(--muted);font-size:11px}.pill{border:1px solid #394157;background:#232a3c;padding:4px 8px;border-radius:99px;color:#c8d1e5;font-size:10px;font-weight:750}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.action{background:#202638;border:1px solid #30384d;border-radius:14px;padding:13px;text-align:left}.action b{display:block;margin:4px 0}.action span{font-size:12px;color:var(--muted)}.action em{font-style:normal;font-size:19px}
input,textarea,select{width:100%;background:#101522;border:1px solid #343b50;border-radius:12px;padding:12px;color:var(--text)}textarea{min-height:115px;resize:vertical}label{display:block;color:#cbd2e3;font-size:12px;font-weight:750;margin:13px 0 6px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{border:1px dashed #3a4259;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
.studyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.studycard{min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;cursor:pointer;perspective:1000px}.studycard .inner{max-width:680px}.studycard .hint{color:var(--muted);font-size:12px;margin-top:22px}.studycard .word{font-size:clamp(24px,5vw,38px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}.studycard .side{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--cyan);font-weight:850;margin-bottom:16px}.studycontrols{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.counter{color:var(--muted);font-size:13px}.answerlist{display:grid;gap:9px;margin-top:16px}.answer{padding:13px 15px;text-align:left;border:1px solid #394157;background:#202638;border-radius:12px}.answer.correct{border-color:var(--green);background:#17372e}.answer.wrong{border-color:#f28b9b;background:#3b222d}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#202638;color:#dce4f5}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matchitem{min-height:85px;border:1px solid #394157;border-radius:13px;background:#202638;padding:12px;text-align:center;display:grid;place-items:center;overflow-wrap:anywhere}.matchitem.selected{border-color:var(--purple);background:#302b4c}.matchitem.done{opacity:.3;pointer-events:none}.note{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e8f7f4;color:#10201f;padding:11px 17px;border-radius:99px;font-weight:800;box-shadow:0 10px 40px #0007;z-index:20;display:none}.modalback{position:fixed;inset:0;background:#070911cc;display:none;place-items:center;padding:15px;z-index:10}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#191e2c;border:1px solid #3a4259;border-radius:20px;padding:20px;box-shadow:0 25px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center}.termrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.termrow input{min-width:0}.chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:#101522;border-radius:14px;margin:12px 0}.bubble{max-width:90%;padding:11px 13px;border-radius:13px;background:#252c3e;white-space:pre-wrap}.bubble.me{align-self:flex-end;background:#373052}.chatbar{display:flex;gap:8px}.chatbar input{flex:1}.stdgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stdcard{background:#171c29;border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.stdcard h3{margin:0 0 5px;font-size:15px}.stdcard p{color:var(--muted);font-size:12px;margin:7px 0 12px}.stdcard a{display:inline-block;color:#bdb4ff;font-weight:800;font-size:12px;text-decoration:none;border:1px solid #494366;padding:8px 10px;border-radius:9px}.stdcard a:hover{background:#292541}.stdtools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.stdtag{display:inline-block;border:1px solid #394157;background:#232a3c;padding:4px 8px;border-radius:99px;color:#c8d1e5;font-size:10px;font-weight:750}.hidden{display:none!important}
@media(max-width:780px){.app{padding:14px 13px 90px}.grid{grid-template-columns:1fr}.setgrid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.hero .primary{width:100%}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:21px}.top{margin-bottom:18px}.panel{padding:15px}}
@media(max-width:420px){.setgrid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.termrow{grid-template-columns:1fr 1fr}.termrow button{grid-column:span 2}.tabs{margin-left:-2px;margin-right:-2px}.tab{padding:9px 12px}.streak{font-size:11px;padding:7px 9px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">S</div><div>StudyOS <small>MAX LEARNING SYSTEM</small></div></div><div class="topright"><div class="streak">🔥 <span id="streak">0</span> day streak</div><div class="avatar">S</div></div></header>
<section class="hero"><div><div class="eyebrow">Your personal learning space</div><h1>Make knowledge<br>actually stick.</h1><p>Study smarter with cards, adaptive practice, tests, and your AI-style study coach.</p></div><button class="primary" id="newSetBtn">＋ Create a study set</button></section>
<nav class="tabs" id="tabs"><button class="tab active" data-page="home">⌂ Home</button><button class="tab" data-page="library">▤ Library</button><button class="tab" data-page="create">＋ Create</button><button class="tab" data-page="tutor">✧ Study coach</button><button class="tab" data-page="standards">⌖ Arizona Standards</button><button class="tab" data-page="progress">◷ Progress</button></nav>
<main id="main"></main>
</div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='studyos-max-v1';
const starter=[
{id:'biology',title:'Cell Biology',subject:'Biology',desc:'The building blocks of life',terms:[['Mitochondria','The organelle that produces most of the cell’s usable energy (ATP).'],['Ribosome','A structure that builds proteins.'],['Cell membrane','A selective barrier that controls what enters and leaves the cell.'],['Nucleus','The organelle that stores most of a eukaryotic cell’s DNA.'],['Cytoplasm','The gel-like material inside the cell where many reactions happen.']],created:Date.now()},
{id:'history',title:'World History Basics',subject:'History',desc:'Key terms and ideas',terms:[['Primary source','An original record created during the time being studied.'],['Revolution','A major change in a system of government or society.'],['Democracy','A system in which people have a role in governing, often through voting.'],['Treaty','A formal agreement between countries or groups.']],created:Date.now()},
{id:'science',title:'Physics Foundations',subject:'Science',desc:'Core physics vocabulary',terms:[['Velocity','Speed in a given direction.'],['Acceleration','The rate at which velocity changes over time.'],['Force','A push or pull that can change an object’s motion.'],['Inertia','An object’s tendency to resist changes in its motion.']],created:Date.now()}
];
let data=load(),page='home',activeId=null,mode='cards',idx=0,flipped=false,queue=[],score=0,answered=0,testQuestions=[],matchPairs=[],matchPick=null,matchStart=0,matchTimer=null,chat=[];
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.sets)?d:{sets:starter,progress:{},streak:0,lastDay:'',history:[]}}catch(e){return{sets:starter,progress:{},streak:0,lastDay:'',history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setNow(){return data.sets.find(s=>s.id===activeId)}
function terms(){return setNow()?.terms||[]}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1900)}
function markStudy(){let today=new Date().toISOString().slice(0,10);if(data.lastDay!==today){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);data.streak=data.lastDay===y?(data.streak||0)+1:1;data.lastDay=today}save();document.getElementById('streak').textContent=data.streak||0}
function progress(id){return data.progress[id]||(data.progress[id]={known:[],seen:0,correct:0,wrong:0})}
function mastered(id){let p=progress(id),n=data.sets.find(s=>s.id===id)?.terms.length||0;return n?Math.round(p.known.length/n*100):0}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('streak').textContent=data.streak||0;let m=document.getElementById('main');if(page==='home')home(m);if(page==='library')library(m);if(page==='create')create(m);if(page==='tutor')tutor(m);if(page==='progress')progressPage(m);if(page==='standards')standards(m)}
function home(m){let total=data.sets.reduce((a,s)=>a+s.terms.length,0),known=data.sets.reduce((a,s)=>a+(progress(s.id).known.length),0),recent=data.history.slice(-5).reverse();m.innerHTML=`
<div class="grid"><section class="panel"><div class="eyebrow">Your overview</div><h2>Welcome back, learner.</h2><p class="sub">A little practice today goes a long way.</p><div class="stats"><div class="stat"><strong>${data.sets.length}</strong><span>STUDY SETS</span></div><div class="stat"><strong>${total}</strong><span>FLASHCARDS</span></div><div class="stat"><strong>${known}</strong><span>MASTERED</span></div></div><div class="progress"><i style="width:${total?known/total*100:0}%"></i></div><p class="note">${total?Math.round(known/total*100):0}% of all your cards mastered</p></section>
<section class="panel"><h2>Quick study</h2><p class="sub">Jump straight into a learning mode.</p><div class="actions"><button class="action" data-quick="cards"><em>▱</em><b>Flashcards</b><span>Review and flip</span></button><button class="action" data-quick="learn"><em>✧</em><b>Learn</b><span>Practice what you miss</span></button><button class="action" data-quick="test"><em>✓</em><b>Test</b><span>Check your knowledge</span></button><button class="action" data-quick="match"><em>◈</em><b>Match</b><span>Race the clock</span></button></div></section></div>
<div class="sectionhead"><h2>Pick up where you left off</h2><button class="ghost small" data-goto="library">View library →</button></div><div class="setgrid">${data.sets.slice(0,6).map(card).join('')||'<div class="empty">No study sets yet. Create your first one.</div>'}</div>
<div class="sectionhead"><h2>Recent activity</h2></div><section class="panel">${recent.length?recent.map(h=>'<div class="setmeta"><span>'+esc(h.title)+' · '+esc(h.mode)+'</span><span>'+esc(h.result)+' · '+new Date(h.at).toLocaleDateString()+'</span></div>').join(''):'<p class="sub">Your study sessions will appear here.</p>'}</section>`;
m.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>startMode(b.dataset.quick));m.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));bindCards(m)}
function card(s){return '<article class="setcard" data-open="'+esc(s.id)+'"><div class="seticon">▤</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.subject||'General')+' · '+s.terms.length+' cards</p><div class="setmeta"><span>'+esc(s.desc||'Study set')+'</span><span class="pill">'+mastered(s.id)+'% mastered</span></div></article>'}
function bindCards(m){m.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>{activeId=c.dataset.open;setPage('set')})}
function library(m){m.innerHTML='<div class="sectionhead" style="margin-top:0"><div><h2>Your library</h2><p class="sub">All your study sets, in one place.</p></div><button class="primary small" id="addSet">＋ New set</button></div><div class="setgrid">'+(data.sets.map(card).join('')||'<div class="empty">Your library is empty. Make a study set to get started.</div>')+'</div>';document.getElementById('addSet').onclick=()=>go('create');bindCards(m)}
function create(m){m.innerHTML='<div class="grid"><section class="panel"><div class="eyebrow">Build your materials</div><h2>Create a study set</h2><p class="sub">Add terms manually or turn your notes into draft flashcards.</p><label>Set title</label><input id="setTitle" placeholder="e.g. Chapter 4 — Ecosystems"><div class="formrow"><div><label>Subject</label><input id="setSubject" placeholder="Biology"></div><div><label>Description</label><input id="setDesc" placeholder="What is this set about?"></div></div><label>Terms and definitions</label><div id="termRows"></div><button class="secondary small" id="addTerm">＋ Add another card</button><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="primary" id="saveSet">Save study set</button><button class="ghost" id="importSet">Import text / CSV</button></div></section><section class="panel"><div class="eyebrow">Smart card maker</div><h2>Turn notes into cards</h2><p class="sub">Paste class notes. StudyOS will identify likely key ideas and create editable draft cards.</p><textarea id="notes" placeholder="Paste notes here…&#10;&#10;Example: Photosynthesis is the process plants use to convert light energy into chemical energy. Chlorophyll absorbs light."></textarea><button class="primary" id="generate" style="margin-top:12px;width:100%">✧ Generate draft cards</button><p class="note">This uses local text patterns, not a cloud AI model. Review the cards before saving.</p><div id="draftInfo" class="sub"></div></section></div>';
let rows=document.getElementById('termRows');function addRow(a='',b=''){let d=document.createElement('div');d.className='termrow';d.innerHTML='<input class="term" placeholder="Term or question" value="'+esc(a)+'"><input class="definition" placeholder="Definition or answer" value="'+esc(b)+'"><button class="ghost small remove">×</button>';d.querySelector('.remove').onclick=()=>{if(rows.children.length>1)d.remove();else{d.querySelectorAll('input').forEach(x=>x.value='')}};rows.appendChild(d)}addRow();addRow();
document.getElementById('addTerm').onclick=()=>addRow();
document.getElementById('saveSet').onclick=()=>{let ts=[...rows.children].map(r=>[r.querySelector('.term').value.trim(),r.querySelector('.definition').value.trim()]).filter(x=>x[0]&&x[1]);if(!document.getElementById('setTitle').value.trim()||ts.length<2){toast('Add a title and at least 2 complete cards.');return}let s={id:'s'+Date.now(),title:document.getElementById('setTitle').value.trim(),subject:document.getElementById('setSubject').value.trim()||'General',desc:document.getElementById('setDesc').value.trim(),terms:ts,created:Date.now()};data.sets.unshift(s);save();activeId=s.id;toast('Study set saved!');setPage('set')};
document.getElementById('importSet').onclick=()=>{let t=prompt('Paste one card per line. Separate the term and definition with a tab, comma, or |.');if(!t)return;let parsed=parseLines(t);if(parsed.length<2){toast('Could not find at least 2 cards.');return}parsed.forEach(x=>addRow(x[0],x[1]));toast(parsed.length+' draft cards added.')};
document.getElementById('generate').onclick=()=>{let note=document.getElementById('notes').value.trim();let draft=makeCards(note);if(!draft.length){toast('Add a little more detail to your notes.');return}draft.forEach(x=>addRow(x[0],x[1]));document.getElementById('draftInfo').textContent='Added '+draft.length+' draft cards below. Edit them, add a title, then save.';toast('Draft cards created.')}}
function parseLines(t){return t.split(/\n/).map(l=>{let p=l.split(/\t|\s\|\s|\s+-\s+|,/);return p.length>1?[p[0].trim(),p.slice(1).join(',').trim()]:null}).filter(x=>x&&x[0]&&x[1])}
function makeCards(t){let lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean),out=[];for(let line of lines){let m=line.match(/^(.{2,65}?)\s+(?:is|are|means|refers to|:|—)\s+(.{8,})$/i);if(m)out.push([m[1].replace(/[.:-]$/,''),m[2].replace(/[.]$/,'')]);else{let s=line.split(/(?<=[.!?])\s+/);for(let sentence of s){let q=sentence.match(/^(.{2,55}?)\s+(?:is|are|was|were)\s+(.{8,})$/i);if(q)out.push([q[1]+' — what is it?',q[2].replace(/[.]$/,'')])}}}if(!out.length&&lines.length>=2){out=lines.slice(0,12).map((l,i)=>['Key idea '+(i+1),l])}return out.slice(0,20)}
function setPage(p){page=p;render()}
function go(p){setPage(p)}
function setDetail(m){let s=setNow();if(!s){setPage('library');return}m.innerHTML='<div class="studyhead"><div><button class="ghost small" id="back">← Library</button><h2 style="margin:12px 0 2px">'+esc(s.title)+'</h2><div class="sub">'+esc(s.subject)+' · '+s.terms.length+' cards · '+mastered(s.id)+'% mastered</div></div><button class="ghost small" id="editSet">Edit</button></div><section class="panel"><h2>Study this set</h2><p class="sub">Choose a mode to get started.</p><div class="actions"><button class="action" data-mode="cards"><em>▱</em><b>Flashcards</b><span>Flip through every card</span></button><button class="action" data-mode="learn"><em>✧</em><b>Learn</b><span>Adaptive question practice</span></button><button class="action" data-mode="test"><em>✓</em><b>Test</b><span>Take a generated test</span></button><button class="action" data-mode="match"><em>◈</em><b>Match</b><span>Match terms to definitions</span></button></div></section><div class="sectionhead"><h2>Cards in this set</h2><span class="sub">'+s.terms.length+' total</span></div><section class="panel">'+s.terms.map((t,i)=>'<div class="setmeta" style="padding:10px 0;border-bottom:1px solid #2b3245"><span><b>'+esc(t[0])+'</b><br><span class="sub">'+esc(t[1])+'</span></span><span class="pill">'+(progress(s.id).known.includes(i)?'Mastered':'Learning')+'</span></div>').join('')+'</section><div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="danger small" id="deleteSet">Delete set</button></div>';document.getElementById('back').onclick=()=>setPage('library');document.getElementById('editSet').onclick=()=>editSet();document.getElementById('deleteSet').onclick=()=>{if(confirm('Delete this study set and its progress?')){data.sets=data.sets.filter(x=>x.id!==s.id);delete data.progress[s.id];save();setPage('library')}};m.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode))}
function editSet(){let s=setNow();setPage('create');setTimeout(()=>{document.getElementById('setTitle').value=s.title;document.getElementById('setSubject').value=s.subject;document.getElementById('setDesc').value=s.desc||'';let r=document.getElementById('termRows');r.innerHTML='';s.terms.forEach(t=>{let d=document.createElement('div');d.className='termrow';d.innerHTML='<input class="term" value="'+esc(t[0])+'"><input class="definition" value="'+esc(t[1])+'"><button class="ghost small remove">×</button>';d.querySelector('.remove').onclick=()=>d.remove();r.appendChild(d)});document.getElementById('saveSet').textContent='Update study set';document.getElementById('saveSet').onclick=()=>{let ts=[...r.children].map(x=>[x.querySelector('.term').value.trim(),x.querySelector('.definition').value.trim()]).filter(x=>x[0]&&x[1]);if(ts.length<2){toast('Keep at least 2 cards.');return}s.title=document.getElementById('setTitle').value.trim();s.subject=document.getElementById('setSubject').value.trim();s.desc=document.getElementById('setDesc').value.trim();s.terms=ts;save();setPage('set');toast('Set updated.')}},0)}
function startMode(md){if(!activeId){if(!data.sets.length){setPage('create');return}activeId=data.sets[0].id}mode=md;idx=0;flipped=false;queue=terms().map((_,i)=>i);if(md==='learn')queue.sort((a,b)=>(progress(activeId).known.includes(a)?1:0)-(progress(activeId).known.includes(b)?1:0));score=0;answered=0;if(md==='test')buildTest();if(md==='match')buildMatch();renderMode()}
function renderMode(){let m=document.getElementById('main');if(mode==='cards')flashcards(m);if(mode==='learn')learn(m);if(mode==='test')test(m);if(mode==='match')match(m)}
function modeHead(){return '<div class="studyhead"><div><button class="ghost small" id="exitMode">← Exit study</button><div class="sub" style="margin-top:9px">'+esc(setNow().title)+' · '+mode.toUpperCase()+'</div></div><div class="counter">'+Math.min(idx+1,queue.length)+' / '+queue.length+'</div></div>'}
function exitBind(){document.getElementById('exitMode').onclick=()=>{if(matchTimer)clearInterval(matchTimer);setPage('set')}}
function flashcards(m){if(idx>=queue.length)idx=0;let t=terms()[queue[idx]];m.innerHTML=modeHead()+'<section class="panel studycard" id="flip"><div class="inner"><div class="side">'+(flipped?'DEFINITION':'TERM')+'</div><div class="word">'+esc(t[flipped?1:0])+'</div><div class="hint">Tap the card or press Space to flip</div></div></section><div class="studycontrols"><button class="ghost" id="prev">← Previous</button><button class="secondary" id="shuffle">⇄ Shuffle</button><button class="primary" id="flipBtn">Flip card</button><button class="ghost" id="next">Next →</button></div><p class="note" style="text-align:center">Tip: Try to recall the answer before flipping.</p>';exitBind();document.getElementById('flip').onclick=()=>{flipped=!flipped;flashcards(m)};document.getElementById('flipBtn').onclick=()=>{flipped=!flipped;flashcards(m)};document.getElementById('prev').onclick=()=>{idx=(idx-1+queue.length)%queue.length;flipped=false;flashcards(m)};document.getElementById('next').onclick=()=>{idx=(idx+1)%queue.length;flipped=false;flashcards(m)};document.getElementById('shuffle').onclick=()=>{queue.sort(()=>Math.random()-.5);idx=0;flipped=false;flashcards(m)}}
function learn(m){if(idx>=queue.length){finish('Learn');return}let original=queue[idx],t=terms()[original],opts=[t[1]];let others=terms().filter((x,i)=>i!==original).map(x=>x[1]).sort(()=>Math.random()-.5);opts.push(...others.slice(0,3));opts.sort(()=>Math.random()-.5);m.innerHTML=modeHead()+'<section class="panel"><div class="eyebrow">Choose the correct definition</div><h2 style="font-size:clamp(23px,4vw,32px);margin-top:10px">'+esc(t[0])+'</h2><div class="answerlist">'+opts.map((o,i)=>'<button class="answer" data-answer="'+i+'">'+esc(o)+'</button>').join('')+'</div><div id="feedback"></div></section>';exitBind();m.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(m.dataset.answered)return;m.dataset.answered='1';let right=b.textContent===t[1];answered++;if(right){score++;progress(activeId).correct++;if(!progress(activeId).known.includes(original))progress(activeId).known.push(original);b.classList.add('correct')}else{progress(activeId).wrong++;b.classList.add('wrong');[...m.querySelectorAll('.answer')].find(x=>x.textContent===t[1])?.classList.add('correct')}progress(activeId).seen++;save();markStudy();document.getElementById('feedback').innerHTML='<div class="feedback">'+(right?'✓ Correct!':'Not quite. The correct answer is: <b>'+esc(t[1])+'</b>')+'</div><button class="primary" id="continue" style="margin-top:12px">Continue →</button>';document.getElementById('continue').onclick=()=>{idx++;delete m.dataset.answered;learn(m)}})}
function buildTest(){let ts=terms();testQuestions=ts.map((t,i)=>({i,opts:[t[1],...ts.filter((_,j)=>j!==i).map(x=>x[1]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)})).sort(()=>Math.random()-.5);score=0;answered=0}
function test(m){if(idx>=testQuestions.length){finish('Test');return}let q=testQuestions[idx],t=terms()[q.i];m.innerHTML=modeHead()+'<section class="panel"><div class="eyebrow">Question '+(idx+1)+'</div><h2 style="font-size:26px;margin:12px 0">What does this mean?</h2><p style="font-size:23px;font-weight:800">'+esc(t[0])+'</p><div class="answerlist">'+q.opts.map((o,i)=>'<button class="answer" data-test="'+i+'">'+esc(o)+'</button>').join('')+'</div><div id="testFeedback"></div></section>';exitBind();m.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{if(m.dataset.answered)return;m.dataset.answered='1';let ok=b.textContent===t[1];answered++;if(ok){score++;b.classList.add('correct')}else{b.classList.add('wrong');[...m.querySelectorAll('.answer')].find(x=>x.textContent===t[1])?.classList.add('correct')}document.getElementById('testFeedback').innerHTML='<button class="primary" id="testNext" style="margin-top:14px">Next question →</button>';document.getElementById('testNext').onclick=()=>{idx++;delete m.dataset.answered;test(m)}})}
function buildMatch(){let ts=terms().slice(0,Math.min(6,terms().length));matchPairs=ts.map((t,i)=>({i,term:t[0],def:t[1]}));let all=[...matchPairs.map(x=>({id:x.i,type:'term',text:x.term})),...matchPairs.map(x=>({id:x.i,type:'def',text:x.def}))].sort(()=>Math.random()-.5);matchPairs.cards=all;matchPairs.done=[];matchPick=null;matchStart=Date.now()}
function match(m){if(matchPairs.done.length===matchPairs.length){clearInterval(matchTimer);finish('Match');return}let elapsed=Math.floor((Date.now()-matchStart)/1000);m.innerHTML=modeHead()+'<section class="panel"><div class="studyhead"><div><h2>Find the matching pairs</h2><p class="sub">Select a term, then its definition.</p></div><span class="pill" id="matchClock">'+elapsed+'s</span></div><div class="matchgrid">'+matchPairs.cards.map((c,i)=>'<button class="matchitem '+(matchPairs.done.includes(c.id)?'done':'')+' '+(matchPick===i?'selected':'')+'" data-match="'+i+'">'+esc(c.text)+'</button>').join('')+'</div><p class="note" style="margin-top:13px">'+matchPairs.done.length+' / '+matchPairs.length+' pairs matched</p></section>';exitBind();m.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{let i=+b.dataset.match,c=matchPairs.cards[i];if(matchPairs.done.includes(c.id))return;if(matchPick===null){matchPick=i;match(m);return}let first=matchPairs.cards[matchPick];if(first.id===c.id&&first.type!==c.type){matchPairs.done.push(c.id);score++;}else{toast('Not a pair — try again.')}matchPick=null;match(m)});if(matchTimer)clearInterval(matchTimer);matchTimer=setInterval(()=>{let el=document.getElementById('matchClock');if(el)el.textContent=Math.floor((Date.now()-matchStart)/1000)+'s'},1000)}
function finish(label){if(matchTimer)clearInterval(matchTimer);let pct=answered?Math.round(score/answered*100):Math.round(score/(matchPairs.length||1)*100);data.history.push({title:setNow().title,mode:label,result:score+'/'+(answered||matchPairs.length),at:Date.now()});data.history=data.history.slice(-40);save();markStudy();document.getElementById('main').innerHTML='<section class="panel" style="text-align:center;padding:40px 20px"><div style="font-size:42px">✦</div><div class="eyebrow">Session complete</div><h2 style="font-size:34px;margin:8px">Nice work.</h2><div style="font-size:48px;font-weight:900;color:var(--cyan)">'+(label==='Match'?score+'/'+matchPairs.length:score+'/'+answered)+'</div><p class="sub">'+(label==='Match'?'Pairs matched':label==='Learn'?'Correct answers':'Correct answers')+'</p><div class="progress" style="max-width:360px;margin:18px auto"><i style="width:'+pct+'%"></i></div><p>'+pct+'% accuracy</p><button class="primary" id="again">Study again</button> <button class="ghost" id="done">Back to set</button></section>';document.getElementById('again').onclick=()=>startMode(label.toLowerCase());document.getElementById('done').onclick=()=>setPage('set')}
function tutor(m){let prefs=data.coachSettings||(data.coachSettings={grade:'8',subject:'Use selected set',level:'Beginner',style:'Step-by-step',detail:'Balanced',examples:'Yes',quizAnswers:'Hide until I answer',minutes:'20',context:''});m.innerHTML='<div class="grid"><section class="panel"><div class="eyebrow">Your study coach</div><h2>Ask. Understand. Remember.</h2><p class="sub">Your settings below shape how the offline coach responds.</p><div class="chat" id="chat"><div class="bubble">Hey! I’m your StudyOS coach. I can explain concepts, simplify definitions, make practice questions, or help you study one of your saved sets. What are we working on?</div></div><div class="chatbar"><input id="coachInput" placeholder="Ask your study coach…"><button class="primary" id="sendCoach">Send</button></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px"><button class="ghost small" data-prompt="Quiz me on my current study set.">Quiz me</button><button class="ghost small" data-prompt="Explain my hardest topic in simple steps.">Explain simply</button><button class="ghost small" data-prompt="Make a study plan for today.">Make a study plan</button></div></section><section class="panel"><div class="eyebrow">Coach settings</div><h2>Personalize your coach</h2><p class="sub">These preferences are saved on this device.</p><label>Grade / learning level</label><select id="coachGrade">'+['Elementary','6','7','8','9','10','11','12','College','Adult learner'].map(x=>'<option '+(prefs.grade===x?'selected':'')+' value="'+x+'">'+(x==='Elementary'||x==='College'||x==='Adult learner'?x:'Grade '+x)+'</option>').join('')+'</select><label>Subject focus</label><select id="coachSubject">'+['Use selected set','General','Biology','Science','Math','English','History','Computer Science','Other'].map(x=>'<option '+(prefs.subject===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Difficulty</label><select id="coachLevel">'+['Beginner','Intermediate','Advanced'].map(x=>'<option '+(prefs.level===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Teaching style</label><select id="coachStyle">'+['Step-by-step','Socratic (ask me questions)','Direct explanation','Practice-first'].map(x=>'<option '+(prefs.style===x?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="formrow"><div><label>Answer detail</label><select id="coachDetail">'+['Short','Balanced','Detailed'].map(x=>'<option '+(prefs.detail===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Study-plan length</label><select id="coachMinutes">'+['10','15','20','30','45','60'].map(x=>'<option '+(prefs.minutes===x?'selected':'')+'>'+x+' minutes</option>').join('')+'</select></div></div><label>Include examples?</label><select id="coachExamples"><option '+(prefs.examples==='Yes'?'selected':'')+'>Yes</option><option '+(prefs.examples==='No'?'selected':'')+'>No</option></select><label>Quiz answer behavior</label><select id="coachQuiz"><option '+(prefs.quizAnswers==='Hide until I answer'?'selected':'')+'>Hide until I answer</option><option '+(prefs.quizAnswers==='Show answer after question'?'selected':'')+'>Show answer after question</option></select><label>Study set context</label><select id="coachSet">'+data.sets.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===activeId?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select><label>Extra context / what your teacher expects</label><textarea id="coachContext" placeholder="Example: I have a test Friday. Use vocabulary from Chapter 3. I learn best with everyday examples.">'+esc(prefs.context||'')+'</textarea><button class="secondary" id="saveCoachSettings" style="width:100%;margin-top:12px">Save coach settings</button><p class="note" style="margin-top:13px">This is an offline rule-based helper, not a live large language model. Settings guide its built-in study responses; they do not connect it to the internet or make it know facts outside your materials.</p><button class="ghost" id="exportAll" style="width:100%;margin-top:8px">Export all study data</button></section></div>';let box=document.getElementById('chat');function syncPrefs(){data.coachSettings={grade:document.getElementById('coachGrade').value,subject:document.getElementById('coachSubject').value,level:document.getElementById('coachLevel').value,style:document.getElementById('coachStyle').value,detail:document.getElementById('coachDetail').value,minutes:document.getElementById('coachMinutes').value,examples:document.getElementById('coachExamples').value,quizAnswers:document.getElementById('coachQuiz').value,context:document.getElementById('coachContext').value.trim()};save()}document.getElementById('saveCoachSettings').onclick=()=>{syncPrefs();toast('Coach settings saved.')};function send(v){if(!v.trim())return;syncPrefs();box.innerHTML+='<div class="bubble me">'+esc(v)+'</div>';let response=coachReply(v,document.getElementById('coachSet').value);box.innerHTML+='<div class="bubble">'+esc(response)+'</div>';box.scrollTop=box.scrollHeight;document.getElementById('coachInput').value=''}document.getElementById('sendCoach').onclick=()=>send(document.getElementById('coachInput').value);document.getElementById('coachInput').onkeydown=e=>{if(e.key==='Enter')send(e.target.value)};m.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));document.getElementById('exportAll').onclick=exportData}
function coachReply(q,id){let s=data.sets.find(x=>x.id===id),p=data.coachSettings||{},low=q.toLowerCase(),topic=p.subject&&p.subject!=='Use selected set'?p.subject:(s?.subject||'your topic'),level=p.level||'Beginner',detail=p.detail||'Balanced',style=p.style||'Step-by-step',minutes=Number(p.minutes)||20;let context=p.context? '\\n\\nYour extra context: '+p.context:'';let depth=detail==='Short'?'Keep it brief and focused.':detail==='Detailed'?'Add useful explanation and a clear breakdown.':'Give a clear explanation with enough detail to understand.';let example=p.examples!=='No'?'\\n\\nExample: '+(s?'Connect this idea to a familiar real-world situation, then explain how it matches the definition.':'Think of a familiar everyday situation that shows the idea.') : '';if(/quiz|test me|practice question/.test(low)){if(!s||!s.terms.length)return'Create a study set first, then I can quiz you on its terms.';let t=s.terms[Math.floor(Math.random()*s.terms.length)];return'Quick check ('+level+'): '+t[0]+'\\n\\nTry answering from memory before opening your set.'+(p.quizAnswers==='Show answer after question'?'\\n\\nAnswer: '+t[1]:'\\n\\nSend me your answer and I’ll check it.')+context}if(/study plan|routine|schedule/.test(low))return'Here is a focused '+minutes+'-minute plan for '+topic+':\\n\\n1. '+Math.max(2,Math.round(minutes*.15))+' min — preview the material and identify what feels hardest.\\n2. '+Math.round(minutes*.35)+' min — study the key ideas using '+style.toLowerCase()+' practice.\\n3. '+Math.round(minutes*.3)+' min — answer questions without looking.\\n4. '+Math.max(2,minutes-Math.max(2,Math.round(minutes*.15))-Math.round(minutes*.35)-Math.round(minutes*.3))+' min — review mistakes and summarize what you learned.\\n\\nGoal: understand the ideas, not just reread them.'+context;if(/flashcard|make cards|turn.*notes/.test(low))return'Open Create → paste your notes into “Turn notes into cards.” StudyOS will identify likely term-definition statements and add editable draft cards. Review them before saving.';if(/explain|simple|confus|understand|what is|what does/.test(low)&&s){let term=s.terms.find(t=>low.includes(t[0].toLowerCase()));if(term){let opener=style==='Socratic (ask me questions)'?'First, think about what job this concept performs. Here is the key idea: ':style==='Direct explanation'?'Here is the direct explanation: ':'Let’s break it down: ';return opener+'\\n\\n'+term[0]+' means: '+term[1]+'\\n\\n'+depth+example+'\\n\\nCheck your understanding: explain '+term[0]+' in your own words.'+context}return'For '+topic+', start by identifying what the concept is, what it does, and why it matters. Then explain it in your own words.\\n\\n'+depth+example+'\\n\\nYour selected set is “'+s.title+'”. Ask me about one exact term and I’ll use its saved definition.'+context}if(/hello|hi\\b|hey/.test(low))return'Hey! I’m set to help at '+(p.grade||'your')+' level, with '+level.toLowerCase()+' explanations about '+topic+'. Pick a topic or ask for a mini quiz.'+context;if(s)return'I can help you work through “'+s.title+'”. Try asking me to quiz you, explain a specific term, or make a study plan.\\n\\nYour set has '+s.terms.length+' cards, and '+mastered(s.id)+'% are marked mastered.\\n\\nCoach settings: '+(p.grade||'Grade not set')+' · '+level+' · '+style+'.'+context;return'I can help with study strategies, simple explanations, and practice prompts. Select a study set or tell me your subject and topic. For factual topics beyond your saved cards, double-check with your class notes or textbook.'+context}>
